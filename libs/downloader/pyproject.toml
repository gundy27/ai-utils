[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "gundy-ai-downloader"
version = "0.1.0"
description = "Generic file downloader with support for multiple sources (HTTP, FTP, SFTP, S3, etc.)"
authors = ["Dan Gunderson <dan@gundy.ai>"]
readme = "README.md"
packages = [{include = "gundy_ai", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
# Core dependencies
pydantic = "^2.0.0"
structlog = "^23.0.0"
aiofiles = "^23.0.0"

# HTTP/HTTPS downloading
aiohttp = "^3.9.0"
httpx = "^0.25.0"

# Cloud storage
boto3 = "^1.34.0"
botocore = "^1.34.0"

# FTP/SFTP
paramiko = "^3.3.0"  # For SFTP
cryptography = "^41.0.0"

# Retry and rate limiting
tenacity = "^8.2.0"
backoff = "^2.2.0"
aiolimiter = "^1.1.0"

# File handling
pathlib = "*"
hashlib = "*"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
pytest-asyncio = "^0.21.0"
pytest-mock = "^3.12.0"
black = "^23.0.0"
isort = "^5.12.0"
mypy = "^1.0.0"
ruff = "^0.1.0"

[tool.poetry.scripts]
ai-downloader = "gundy_ai.downloader.cli:main"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
# Essential rules for code quality - much more reasonable than the previous 50+ categories
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings  
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "SIM",  # flake8-simplify
]

# Ignore overly strict rules that don't add much value
ignore = [
    "S101",    # Use of assert detected (fine for tests)
    "S104",    # Hardcoded bind all interfaces (0.0.0.0)
    "S108",    # Probable insecure usage of temp file/directory
    "S110",    # Try, Except, Pass detected
    "S112",    # Probable insecure usage of pseudo-random generators
    "S311",    # Standard pseudo-random generators are not suitable for cryptographic purposes
    "S603",    # subprocess call - check for execution of untrusted input
    "S607",    # Starting a process with a partial executable path
    "E501",    # Line too long (handled by black)
    "B008",    # Do not perform function calls in argument defaults
    "B904",    # Within an `except` clause, raise exceptions with `raise ... from err`
    "C901",    # Too complex
    "ARG001",  # Unused function argument
    "ARG002",  # Unused method argument
    "ARG003",  # Unused class method argument
    "ARG004",  # Unused static method argument
    "ARG005",  # Unused lambda argument
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
