[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "gundy-ai-data-pipelines"
version = "0.1.0"
description = "Data processing utilities for AI applications"
authors = ["Dan Gunderson <dan@gundy.ai>"]
readme = "README.md"
packages = [{include = "gundy_ai", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
pandas = "^2.0.0"
pydantic = "^2.0.0"
structlog = "^23.0.0"
python-multipart = "^0.0.6"
aiofiles = "^23.0.0"
openpyxl = "^3.1.0"
python-docx = "^1.0.0"
PyPDF2 = "^3.0.0"
beautifulsoup4 = "^4.12.0"
lxml = "^4.9.0"
tiktoken = "^0.5.0"
openai = "^1.0.0"
click = "^8.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
pytest-asyncio = "^0.21.0"
black = "^23.0.0"
isort = "^5.12.0"
mypy = "^1.0.0"
ruff = "^0.1.0"

[tool.poetry.scripts]
data-pipeline = "gundy_ai.data_pipelines.cli:main"
