[tool.poetry]
name = "gundy-ai-chunker"
version = "0.1.0"
description = "Token-aware text chunking for AI applications"
authors = ["ai-utils <team@ai-utils.dev>"]
readme = "README.md"
packages = [{include = "gundy_ai", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
pydantic = ">=2.5,<3.0"
structlog = ">=23.2,<25.0"
tiktoken = ">=0.5,<1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
pytest-asyncio = "^0.21"
pytest-cov = "^4.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --cov=gundy_ai.chunker --cov-report=term-missing"

