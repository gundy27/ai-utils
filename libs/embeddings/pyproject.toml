[tool.poetry]
name = "gundy-ai-embeddings"
version = "0.1.0"
description = "Provider-agnostic embedding generation for AI applications"
authors = ["ai-utils <team@ai-utils.dev>"]
readme = "README.md"
packages = [{include = "gundy_ai", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
pydantic = ">=2.5,<3.0"
structlog = ">=23.2,<25.0"
httpx = ">=0.25,<1.0"
openai = {version = ">=1.0,<2.0", optional = true}

[tool.poetry.extras]
openai = ["openai"]

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
pytest-asyncio = "^0.21"
pytest-cov = "^4.1"
pytest-mock = "^3.12"
openai = ">=1.0,<2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --cov=gundy_ai.embeddings --cov-report=term-missing"

