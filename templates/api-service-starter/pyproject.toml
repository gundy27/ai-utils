[tool.poetry]
name = "api-service-starter"
version = "0.1.0"
description = "FastAPI LLM API starter with logging, config, retries, and streaming"
authors = ["Dan Gunderson <dan@gundy.ai>"]
readme = "README.md"
packages = [
  { include = "app" },
]
license = "MIT"

[tool.poetry.dependencies]
python = ">=3.9,<3.13"
fastapi = "^0.114.0"
uvicorn = { version = "^0.30.6", extras = ["standard"] }
openai = "^1.40.0"
httpx = "^0.27.0"
backoff = "^2.2.1"
python-dotenv = "^1.0.1"
structlog = "^24.1.0"
pydantic = "^2.8.0"
gundy_ai-openai-wrapper = { path = "../../libs/llm_wrappers/openai_wrapper", develop = true }
prometheus-client = "^0.20.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"
httpx = { version = "^0.27.0", extras = ["http2"] }
black = "^24.8.0"
ruff = "^0.6.2"

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E","F","I","UP","B","SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "-q"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"


