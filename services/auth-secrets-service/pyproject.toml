[tool.poetry]
name = "auth-secrets-service"
version = "0.1.0"
description = "Authentication and Secrets Service (API-first, multi-tenant, policy-driven)"
authors = ["Dan Gunderson <dangunderson27@gmail.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
fastapi = "^0.114.0"
uvicorn = { version = "^0.30.6", extras = ["standard"] }
httpx = "^0.27.0"
structlog = "^24.1.0"
pydantic = "^2.8.0"
python-dotenv = "^1.0.1"
backoff = "^2.2.1"
redis = "^5.0.7"
prometheus-client = "^0.20.0"
pyjwt = "^2.9.0"
cryptography = "^43.0.1"
boto3 = "^1.34.0"
hvac = "^2.3.0"
python-multipart = "^0.0.6"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"
pytest-asyncio = "^0.23.0"
httpx = "^0.27.0"
ruff = "^0.6.2"
black = "^24.8.0"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E","F","I","UP","B","SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "-q"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"


